<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabriele Fantini</title>
    <meta name="description" content="Gabriele Fantini — software engineer working on data governance, data products and data mesh at Blindata and in the Open Data Mesh Initiative." />
    <meta property="og:title" content="Gabriele Fantini" />

    <meta property="og:image" content="/art/banner-dark.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
