name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild just after midnight in Rome (23:30 UTC = 00:30 CET / 01:30 CEST),
  # so each day's newspaper issue goes live on its date.
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: .cache/daily-pdf
          key: daily-pdf-${{ github.run_id }}
          restore-keys: daily-pdf-
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
